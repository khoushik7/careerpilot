services:
  # ----------------------------------------------------------------------------
  # Backend Express API Web Service (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: careerpilot-api
    runtime: node
    plan: free
    rootDir: server/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://careerpilot.onrender.com
      - key: FRONTEND_URL
        value: https://careerpilot.onrender.com

  # ----------------------------------------------------------------------------
  # Frontend React + Vite Static Site (Free Global CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: careerpilot
    runtime: static
    rootDir: client/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://careerpilot-api.onrender.com
