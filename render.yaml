services:
  # ----------------------------------------------------------------------------
  # Backend Express API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: smart-career-coach-api
    runtime: node
    rootDir: server/server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: smart-career-coach-client
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: smart-career-coach-client
          property: host

  # ----------------------------------------------------------------------------
  # Frontend React + Vite Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: smart-career-coach-client
    runtime: static
    rootDir: client/client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-career-coach-api
          property: host
