services:
  # ----------------------------------------------------------------------------
  # Backend Express API Web Service (Free Tier)
  # ----------------------------------------------------------------------------
  - type: web
    name: careerpilot-api
    runtime: node
    plan: free
    rootDir: server/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://careerpilot.onrender.com
      - key: FRONTEND_URL
        value: https://careerpilot.onrender.com
      - key: EMAIL_SERVICE
        value: gmail
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend React/Vite Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: careerpilot
    rootDir: client/client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://careerpilot-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
